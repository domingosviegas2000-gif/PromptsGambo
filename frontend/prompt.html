<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompts — PromptsGambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">⚡ PromptsGambo</div>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="prompt.html" class="ativo">Prompts</a>
    </div>
    <div class="nav-auth" id="nav-auth">
      <a href="login-cliente.html"><button class="btn-login">Entrar</button></a>
      <a href="cadastro.html"><button class="btn-register">Registar</button></a>
    </div>
  </nav>

  <!-- CABECALHO -->
  <div class="pagina-header">
    <h1>Biblioteca de Prompts</h1>
    <p>Encontra o prompt perfeito para a tua imagem</p>
  </div>

  <!-- PESQUISA -->
  <div class="pesquisa-bar">
    <input type="text" placeholder="🔍 Pesquisar prompts..." id="pesquisa" oninput="pesquisar()">
  </div>

  <!-- CATEGORIAS -->
  <section class="categorias">
    <button class="cat active" onclick="filtrar(this, 'todos')">✨ Todos</button>
    <button class="cat" onclick="filtrar(this, 'Natureza')">🌿 Natureza</button>
    <button class="cat" onclick="filtrar(this, 'Fantasia')">🧙 Fantasia</button>
    <button class="cat" onclick="filtrar(this, 'Urbano')">🏙️ Urbano</button>
    <button class="cat" onclick="filtrar(this, 'Pessoas')">👤 Pessoas</button>
    <button class="cat" onclick="filtrar(this, 'Animais')">🐾 Animais</button>
    <button class="cat" onclick="filtrar(this, 'Espaco')">🚀 Espaco</button>
  </section>

  <!-- FILTRO PREMIUM -->
  <div class="filtro-premium">
    <button class="filtro-btn active" onclick="filtrarPremium(this, 'todos')">Todos</button>
    <button class="filtro-btn" onclick="filtrarPremium(this, 'gratis')">Gratis</button>
    <button class="filtro-btn" onclick="filtrarPremium(this, 'premium')">Premium</button>
  </div>

  <!-- GRID DE PROMPTS -->
  <section class="prompts-grid" id="prompts"></section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2024 PromptsGambo. Todos os direitos reservados.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
