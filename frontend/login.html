<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PromptsGambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-auth">

  <div class="auth-box">
    <a href="index.html" class="logo-center">⚡ PromptsGambo</a>
    <h2>Area do Administrador</h2>
    <p class="auth-sub">Acesso restrito</p>

    <div class="admin-aviso">
      🔒 Esta area e apenas para administradores
    </div>

    <input type="email" placeholder="Email de Admin" id="admin-email">
    <input type="password" placeholder="Password" id="admin-password">

    <button class="btn-submit admin-btn" onclick="loginAdmin()">
      Entrar como Admin
    </button>

    <p class="auth-link"><a href="index.html">← Voltar ao site</a></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
