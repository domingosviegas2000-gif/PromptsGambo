<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — PromptsGambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-auth">

  <div class="auth-box">
    <a href="index.html" class="logo-center">⚡ PromptsGambo</a>
    <h2>Criar Conta Gratis</h2>
    <p class="auth-sub">Junta-te a milhares de criadores</p>

    <input type="text" placeholder="Nome completo" id="nome">
    <input type="email" placeholder="Email" id="email">
    <input type="password" placeholder="Password" id="password">
    <input type="password" placeholder="Confirmar Password" id="confirmar">

    <button class="btn-submit" onclick="registar()">Criar Conta</button>

    <div class="auth-divider">ou</div>

    <button class="btn-google" onclick="registarGoogle()">
      🌐 Continuar com Google
    </button>

    <p class="auth-link">Ja tens conta? <a href="login-cliente.html">Entra aqui</a></p>
  </div>

  <script type="module" src="firebase.js"></script>
</body>
</html>
