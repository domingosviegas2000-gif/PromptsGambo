<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — PromptsGambo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-auth">

  <div class="auth-box">
    <a href="index.html" class="logo-center">⚡ PromptsGambo</a>
    <h2>Bem-vindo de volta!</h2>
    <p class="auth-sub">Entra na tua conta</p>

    <input type="email" placeholder="Email" id="email">
    <input type="password" placeholder="Password" id="password">

    <div class="esqueci">
      <a href="#">Esqueceste a password?</a>
    </div>

    <button class="btn-submit" onclick="loginCliente()">Entrar</button>

    <div class="auth-divider">ou</div>

    <button class="btn-google" onclick="loginGoogle()">
      🌐 Continuar com Google
    </button>

    <p class="auth-link">Nao tens conta? <a href="cadastro.html">Regista-te gratis</a></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
